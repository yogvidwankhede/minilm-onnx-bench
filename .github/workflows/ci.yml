name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TORCH_INDEX: https://download.pytorch.org/whl/cpu
  MODEL: yogvidwankhede/healthmate-minilm-l6-v2-medical-3fold

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.15.11"  # pinned: formatter output changes between releases
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url "$TORCH_INDEX"
          pip install -e ".[dev]"
      - name: Unit, parity and service tests (offline, tiny models)
        run: pytest -q

  bundle:
    # Release gate: a bundle is only produced if the parity gate passes.
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install torch --index-url "$TORCH_INDEX"
          pip install -e ".[build]"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.MODEL }}
      - name: Package the fine-tuned model (fp32), gated on parity
        run: python -m minilm_onnx.package --model "$MODEL" --variant fp32 --out bundles
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundles/
          retention-days: 7

  image:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: bundles/
      - name: Build serving image
        run: |
          BUNDLE=$(ls -d bundles/*/ | head -1)
          docker build --build-arg BUNDLE="${BUNDLE%/}" -t minilm-embed:ci .
          docker image ls minilm-embed:ci --format 'image size: {{.Size}}'
      - name: Image has no torch, runs as non-root, can read its bundle
        run: |
          docker run --rm --entrypoint ls minilm-embed:ci -ld /models /models/current
          docker run --rm --entrypoint python minilm-embed:ci -c \
            "import json; json.load(open('/models/current/manifest.json'))"
          test "$(docker run --rm --entrypoint id minilm-embed:ci -u)" = "10001"
          docker run --rm --entrypoint python minilm-embed:ci -c \
            "import importlib.util as u, sys; sys.exit(u.find_spec('torch') is not None)"
      - name: Container smoke test
        run: |
          docker run -d --name embed -p 8080:8080 -e EMBED_INTRA_OP_THREADS=2 minilm-embed:ci
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' embed)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' embed | grep -qx healthy
          curl -sf localhost:8080/v1/embeddings -H 'content-type: application/json' \
               -d '{"input":["fever and cough","knee pain"]}' \
            | python -c "import sys,json; d=json.load(sys.stdin); assert len(d['data'])==2 and len(d['data'][0]['embedding'])==384; print(d['model'], d['usage'])"
          curl -sf localhost:8080/metrics | grep -q '^embed_ready 1.0'
      - name: Graceful shutdown drains
        run: |
          docker stop -t 30 embed
          docker logs embed 2>&1 | grep -q '"msg": "stopped"'
      - name: Container logs
        if: always()
        run: docker logs embed 2>&1 | tail -50 || true

  perf:
    # Performance over time: benchmark the real model against PyTorch on this
    # runner, gate on regressions, and (on main) append to the perf-history branch.
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install torch --index-url "$TORCH_INDEX"
          pip install -e ".[build]" matplotlib
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.MODEL }}
      - name: Load performance history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" perf-history >/dev/null; then
            git clone --quiet --depth 50 --branch perf-history --single-branch "$url" history
          else
            git init --quiet -b perf-history history
            git -C history remote add origin "$url"
          fi
      - name: Performance gate (fine-tuned weights)
        id: gate
        run: |
          set +e
          record=""
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            record="--record"
          fi
          python tools/perf_gate.py --model "$MODEL" --history history/history.jsonl \
            --floors perf/floors.json $record --summary "$GITHUB_STEP_SUMMARY"
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Publish history and trend chart
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python tools/perf_history.py history/history.jsonl history
          cd history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "perf: ${GITHUB_SHA::7} (gate exit ${{ steps.gate.outputs.status }})"
          git push --quiet origin perf-history
      - name: Fail if the performance gate failed
        if: steps.gate.outputs.status != '0'
        run: exit 1
