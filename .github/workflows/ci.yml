name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Unit + parity tests (offline, tiny model)
        run: pytest -q
      - name: Smoke-run the full pipeline on the same-architecture stand-in
        run: python -m minilm_onnx --model standin --quick --out smoke --artifacts smoke_art
