ystem, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">once per process</text><text x="44" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start">Request path</text><text x="44" y="576" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">every call</text><rect x="230" y="392" width="190" height="60" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1"/><text x="325.0" y="419.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Verify bundle</text><text x="325.0" y="437.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">SHA-256 of every file</text><rect x="460" y="392" width="160" height="60" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1"/><text x="540.0" y="419.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Warm up</text><text x="540.0" y="437.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">allocate ORT arenas</text><rect x="660" y="392" width="240" height="60" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1"/><text x="780.0" y="419.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Golden self-test</text><text x="780.0" y="437.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">vs PyTorch · own ONNX · batch-of-1</text><rect x="940" y="392" width="170" height="60" rx="8" fill="#0f2d1a" stroke="#3fb950" stroke-width="1.5"/><text x="1025.0" y="419.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Ready</text><text x="1025.0" y="437.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">/readyz returns 200</text><path d="M 420 422.0 L 458 422.0" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a)"/><path d="M 620 422.0 L 658 422.0" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a)"/><path d="M 900 422.0 L 938 422.0" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="1130" y="420.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#f85149" text-anchor="start">any failure:</text><text x="1130" y="436.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f85149" text-anchor="start">never becomes ready</text><rect x="230" y="532" width="120" height="60" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1"/><text x="290.0" y="559.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Client</text><text x="290.0" y="577.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">OpenAI SDK, curl</text><rect x="376" y="532" width="172" height="60" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1"/><text x="462.0" y="559.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">FastAPI</text><text x="462.0" y="577.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">validate · admit or 503</text><rect x="574" y="532" width="128" height="60" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1"/><text x="638.0" y="559.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Tokenizer</text><text x="638.0" y="577.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">Rust, shared code</text><rect x="728" y="532" width="146" height="60" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1"/><text x="801.0" y="559.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Bounded queue</text><text x="801.0" y="577.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">backpressure</text><rect x="900" y="532" width="184" height="60" rx="8" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/><text x="992.0" y="559.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Dynamic batcher</text><text x="992.0" y="577.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor=