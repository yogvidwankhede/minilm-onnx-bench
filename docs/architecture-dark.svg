 y="633.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#4493f8" text-anchor="middle">response: 384-d unit vectors, float or base64</text><line x1="44" y1="660" x2="1256" y2="660" stroke="#30363d" stroke-width="1"/><text x="44" y="686" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#9198a1" text-anchor="start" letter-spacing="0.08em">OPERATIONS</text><text x="150" y="686" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">/metrics for Prometheus  ·  JSON logs without request text  ·  /livez fails if the batcher dies  ·  503 + Retry-After when the queue is full  ·  drain on SIGTERM</text></svg>